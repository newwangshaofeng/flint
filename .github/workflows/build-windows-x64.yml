name: Build Windows x64 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag name (e.g. v0.11.3-droid.1, leave empty to auto-generate)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release Title (leave empty for default title)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows-x64:
    name: Build & Release Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Enable Long Paths on Windows
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup NASM (for aws-lc-sys)
        uses: ilammy/setup-nasm@v1

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Determine Release Tag and Version
        id: release_info
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.release_tag }}".Trim()
          if ($inputTag) {
              $tag = $inputTag
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
              $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
              $dateStr = Get-Date -Format "yyyyMMdd.HHmm"
              $commit = (git rev-parse --short HEAD).Trim()
              $tag = "v0.11.3-win64-$dateStr-$commit"
          }

          $version = $tag -replace '^v', ''
          $inputTitle = "${{ inputs.release_title }}".Trim()
          if ($inputTitle) {
              $title = $inputTitle
          } else {
              $title = "Flint Windows x64 ($tag) - with Droid Agent Threads"
          }

          Write-Host "Release Tag: $tag"
          Write-Host "Release Version: $version"
          Write-Host "Release Title: $title"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: Build Windows Packages
        shell: pwsh
        env:
          ZED_WORKSPACE: ${{ github.workspace }}
          ZED_RELEASE_CHANNEL: stable
          RELEASE_CHANNEL: stable
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          Write-Host "===> Starting bundle-windows.ps1 for x86_64..."
          .\script\bundle-windows.ps1 -Architecture x86_64

          if (-not (Test-Path "target\Flint-x86_64.exe")) {
              Write-Error "target\Flint-x86_64.exe was not produced!"
              exit 1
          }

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          # 1. Installer executable
          $installerCandidates = @(
              (Join-Path $env:GITHUB_WORKSPACE "target\Flint-x86_64.exe"),
              (Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\Flint-x86_64.exe"),
              (Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "target") -Filter "Flint*x86_64*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          )
          $installerSrc = $installerCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($installerSrc) {
              $installerDst = Join-Path $artifactDir "Flint-x86_64-installer.exe"
              Copy-Item -Path $installerSrc -Destination $installerDst -Force
              Write-Host "Prepared Installer: $installerDst"
          } else {
              Write-Warning "Installer executable not found in target directories."
          }

          # 2. Standalone raw executable
          $rawExeCandidates = @(
              (Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\flint.exe"),
              (Join-Path $env:GITHUB_WORKSPACE "target\release\flint.exe"),
              (Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\inno\Flint.exe")
          )
          $rawExeSrc = $rawExeCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($rawExeSrc) {
              $rawExeDst = Join-Path $artifactDir "flint.exe"
              Copy-Item -Path $rawExeSrc -Destination $rawExeDst -Force
              Write-Host "Prepared Standalone flint.exe: $rawExeDst"
          }

          # 3. Portable zip package
          $portableDir = Join-Path $env:RUNNER_TEMP "flint-portable"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null

          $innoDirCandidates = @(
              (Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\inno"),
              (Join-Path $env:GITHUB_WORKSPACE "target\inno")
          )
          $innoDir = $innoDirCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($innoDir) {
              Copy-Item -Path "$innoDir\*" -Destination $portableDir -Recurse -Force
          } else {
              $flintExe = (Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\flint.exe")
              if (-not (Test-Path $flintExe)) { $flintExe = (Join-Path $env:GITHUB_WORKSPACE "target\release\flint.exe") }
              if (Test-Path $flintExe) {
                  Copy-Item -Path $flintExe -Destination "$portableDir\Flint.exe" -Force
              }
          }

          $portableZip = Join-Path $artifactDir "flint-windows-x86_64-portable.zip"
          Compress-Archive -Path "$portableDir\*" -DestinationPath $portableZip -Force
          Write-Host "Prepared Portable ZIP: $portableZip"

          # 4. Optional remote server zip
          $remoteServerCandidates = @(
              (Join-Path $env:GITHUB_WORKSPACE "target\flint-remote-server-windows-x86_64.zip"),
              (Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\flint-remote-server-windows-x86_64.zip")
          )
          $remoteServerSrc = $remoteServerCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($remoteServerSrc) {
              Copy-Item -Path $remoteServerSrc -Destination $artifactDir -Force
              Write-Host "Prepared Remote Server: $remoteServerSrc"
          }

          # 5. Generate SHA256 checksums
          Push-Location $artifactDir
          $checksums = Get-ChildItem -File | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8
          Pop-Location

          Write-Host "Generated artifacts in directory: $artifactDir"
          Get-ChildItem $artifactDir | Select-Object Name, Length

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: flint-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

      - name: Create or Update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          TITLE: ${{ steps.release_info.outputs.title }}
          IS_PRERELEASE: ${{ inputs.prerelease || 'false' }}
          IS_DRAFT: ${{ inputs.draft || 'false' }}
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          $files = @(Get-ChildItem -Path $artifactDir -File | ForEach-Object { $_.FullName })

          $notes = @"
          ## Flint Windows x86_64 Release

          This release provides the Windows x64 binary of Flint, built directly on GitHub Actions.

          ### ✨ Included Features
          - **First-class Droid Agent Threads**:
            - Droid (Factory CLI) is now integrated into Flint's Agent Threads left sidebar (positioned first, before Codex).
            - Automatic discovery and indexing of previous Droid sessions from `~/.factory/sessions/`.
            - One-click session resumption via `droid --resume <session_id>`.
            - Dedicated attention detection for Droid's interactive command approvals and folder trust prompts.
            - Customizable initialization commands and visibility toggles in Settings.
            - New menu item and Command Palette action: **New Droid Thread** (`agent_threads::NewDroidThread`).

          ### 📦 Assets
          - **`Flint-x86_64-installer.exe`**: Standard Windows installer (recommended).
          - **`flint-windows-x86_64-portable.zip`**: Portable archive (extract and double-click `Flint.exe` to run).
          - **`flint.exe`**: Standalone executable binary.
          - **`SHA256SUMS.txt`**: SHA-256 verification checksums for all files.
          "@

          $notesFile = Join-Path $env:RUNNER_TEMP "release_notes.md"
          $notes | Set-Content -Path $notesFile -Encoding utf8

          # Check if release already exists using gh cli exit code
          & gh release view "$($env:TAG)" >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $($env:TAG) already exists. Uploading/clobbering assets..."
              & gh release upload "$($env:TAG)" @files --clobber
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to upload assets to release $($env:TAG)"
                  exit 1
              }
          } else {
              Write-Host "Creating new release $($env:TAG)..."
              $createArgs = @(
                  "release", "create", "$($env:TAG)",
                  "--title", "$($env:TITLE)",
                  "--notes-file", "$notesFile"
              )

              if ($env:IS_PRERELEASE -eq "true") {
                  $createArgs += "--prerelease"
              }
              if ($env:IS_DRAFT -eq "true") {
                  $createArgs += "--draft"
              }

              $createArgs += $files
              & gh @createArgs
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to create release $($env:TAG)"
                  exit 1
              }
          }

          Write-Host "Release created/updated successfully at $($env:TAG)!"
